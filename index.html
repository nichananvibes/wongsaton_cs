<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ราตรีบุปผา 花月夜</title><style>
*{box-sizing:border-box}body{margin:0;background:#160d22;color:#ffe9bd;font-family:Tahoma,sans-serif}header{text-align:center;padding:24px;background:linear-gradient(90deg,#310e20,#801b30,#310e20);border-bottom:2px solid #c99b52}h1{font-size:clamp(26px,5vw,48px);margin:8px;color:#ffdb8e}small{letter-spacing:5px}main{max-width:1150px;margin:auto;padding:18px}.scene{position:relative;height:400px;overflow:hidden;border:1px solid #c99b52;border-radius:20px;background:linear-gradient(#130d30,#65334e 62%,#132d40 63%,#101b35)}.scene svg{width:100%;height:100%;position:absolute;inset:0}.moon{filter:drop-shadow(0 0 18px #ffcf78)}.float{position:absolute;bottom:12%;left:50%;font-size:50px;text-align:center;filter:drop-shadow(0 0 12px gold);animation:bob 3s infinite ease-in-out;white-space:nowrap}.sail{animation:sail 8s forwards ease-in-out}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes sail{to{transform:translate(32vw,-100px) scale(.35);opacity:.25}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{background:#2d172c;border:1px solid #93643d;border-radius:16px;padding:20px}h2{font-size:19px;color:#ffd58a}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#492138;color:#ffe9bd;border:1px solid #a77949;border-radius:10px;padding:12px;margin:4px}button.active,button:hover{background:#8c293b;border-color:#ffdc8c}input,textarea,select{width:100%;padding:12px;background:#190f24;color:#ffe9bd;border:1px solid #93643d;border-radius:8px;margin:6px 0}label{display:inline-block;margin:7px}label input{width:auto;accent-color:#dba44f}.primary{background:linear-gradient(110deg,#a32839,#d09a48);color:white;width:100%;font-size:20px;margin:10px 0}.preview{text-align:center;font-size:48px;min-height:90px}.caption{text-align:center;color:#e3b878;font-size:14px}footer{text-align:center;padding:20px}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffdf9a}@media(max-width:650px){.grid{grid-template-columns:1fr}.scene{height:300px}}</style><header><small>花 月 夜 · เทศกาลแห่งแสงจันทร์</small><h1>ราตรีบุปผา</h1>ล่องกระทง ณ หอเริงรมย์แห่งนครฉางอัน</header><main><div class="scene"><svg viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#49364d"/><stop offset="1" stop-color="#101b35"/></linearGradient><g id="hall"><path d="M0 85 Q45 80 100 25 Q155 80 200 85 L180 96 H20Z" fill="#641d2d" stroke="#d5a14c" stroke-width="3"/><path d="M25 96H175V200H25Z" fill="#411b2b"/><path d="M40 105H70V165H40ZM85 105H115V165H85ZM130 105H160V165H130Z" fill="#f7b85b"/><path d="M15 200H185" stroke="#c58c45" stroke-width="8"/><path d="M30 96V200M78 96V200M122 96V200M170 96V200" stroke="#852b35" stroke-width="8"/></g><g id="lantern"><path d="M0 -35V-20M0 20V35" stroke="#e5b961" stroke-width="2"/><ellipse rx="15" ry="21" fill="#df3d38" stroke="#ffd080"/><ellipse rx="7" ry="21" fill="none" stroke="#ffac65"/><path d="M-10 -21H10M-10 21H10" stroke="#f5cc79" stroke-width="4"/></g></defs><circle class="moon" cx="520" cy="72" r="45" fill="#ffe1a0"/><g fill="#ffe4b2"><circle cx="120" cy="40" r="2"/><circle cx="340" cy="55" r="2"/><circle cx="700" cy="30" r="2"/><circle cx="880" cy="65" r="2"/></g><path d="M0 220L120 110 220 190 340 100 460 220 620 130 800 210 920 120 1000 210V270H0" fill="#29203a"/><use href="#hall" x="30" y="45"/><use href="#hall" x="240" y="65"/><use href="#hall" x="760" y="45"/><rect y="250" width="1000" height="150" fill="url(#water)"/><g stroke="#d5a264" opacity=".4" stroke-width="3"><path d="M30 270H190M60 290H150M280 275H420M780 270H940M810 300H910M450 280H570M470 310H550M430 350H590"/></g><path d="M0 20Q500 130 1000 20" fill="none" stroke="#b98a50" stroke-width="2"/><use href="#lantern" x="100" y="65"/><use href="#lantern" x="250" y="92"/><use href="#lantern" x="400" y="105"/><use href="#lantern" x="600" y="105"/><use href="#lantern" x="750" y="92"/><use href="#lantern" x="900" y="65"/></svg><div id="river"></div></div><div class="grid"><section class="panel"><h2>01 · เลือกนางสนมคู่ใจ</h2><div id="ladies"></div><p id="ladyText"></p><h2>02 · เลือกกระทง</h2><div id="types"></div><h2>03 · สีแห่งโชคลาภ</h2><select id="color"><option value="#ff79ae">ชมพูบุปผา</option><option value="#ffd15c">ทองมั่งคั่ง</option><option value="#62dfb2">เขียวหยก</option><option value="#b59aff">ม่วงจันทรา</option><option value="#ff5353">แดงมงคล</option></select><h2>04 · เครื่องประดับ</h2><div id="decor"></div></section><section class="panel"><h2>กระทงของคุณ</h2><div id="preview" class="preview"></div><div class="caption" id="summary"></div><h2>05 · คำอธิษฐานใต้แสงจันทร์</h2><input id="name" maxlength="50" placeholder="ชื่อของคุณ"><textarea id="wish" maxlength="300" rows="4" placeholder="ขอให้ความสุขและโชคลาภไหลมาเทมา..."></textarea><button class="primary" id="launch">🏮 ลอยกระทง</button><p id="message" role="status"></p><button id="share">แชร์เว็บไซต์</button><button id="reset">เริ่มใหม่</button></section></div></main><footer>花好月圆 · ขอให้ชีวิตงดงามดั่งบุปผาและจันทร์เพ็ญ</footer><script>
const $=id=>document.getElementById(id), ladies=['🌸 เหมยหลิน · ชุดชมพู','🪭 หลี่ฮวา · ชุดแดง','💚 อวี้หลาน · ชุดเขียวหยก','🌙 เยว่ซิน · ชุดม่วง'],types=['🪷 ดอกบัว','🦢 หงส์ทอง','🐉 มังกร','🌺 บุปผา'],decs=['🕯️ เทียน','💎 หยก','📿 ไข่มุก','🌸 ดอกเหมย','🎀 พู่ทอง','✨ เกล็ดทอง','🌼 ดอกไม้','🏮 โคมจิ๋ว'];let lady=0,type=0;function choices(id,items,fn){items.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.classList.toggle('active',i===0);b.onclick=()=>{[...$(id).children].forEach(x=>x.classList.remove('active'));b.classList.add('active');fn(i);update()};$(id).append(b)})}choices('ladies',ladies,i=>lady=i);choices('types',types,i=>type=i);decs.forEach((s,i)=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=s.split(' ')[0];c.checked=i===0;c.onchange=update;l.append(c,s);$('decor').append(l)});function art(){return types[type].split(' ')[0]+[...$('decor').querySelectorAll('input:checked')].map(x=>x.value).join('')}function update(){$('ladyText').textContent=ladies[lady]+' พร้อมร่วมอธิษฐานกับคุณ';$('preview').textContent=art();$('preview').style.filter='drop-shadow(0 0 14px '+$('color').value+')';$('summary').textContent=types[type]+' · '+$('color').selectedOptions[0].textContent}$('color').onchange=update;update();$('launch').onclick=()=>{let f=document.createElement('div');f.className='float sail';f.textContent=art();f.style.filter='drop-shadow(0 0 15px '+$('color').value+')';$('river').append(f);setTimeout(()=>f.remove(),8500);$('message').textContent='กระทงของ '+($('name').value.trim()||'คุณ')+' ลอยสู่สายน้ำแล้ว\n'+($('wish').value.trim()||'ขอให้สมปรารถนา')+'\n'+ladies[lady].split(' · ')[0]+' ขออวยพรให้คุณมีความสุข';document.querySelector('.scene').scrollIntoView({behavior:'smooth'})};$('reset').onclick=()=>location.reload();$('share').onclick=async()=>{if(location.protocol==='file:'){$('message').textContent='โปรดเผยแพร่ผ่าน GitHub Pages ก่อนแชร์ลิงก์';return}try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);$('message').textContent='คัดลอกลิงก์แล้ว'}}catch(e){$('message').textContent=location.href}};
</script></html>
